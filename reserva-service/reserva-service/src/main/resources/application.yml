server:
  port: 8085

spring:
  application:
    name: reserva-service
  datasource:
    url: jdbc:mysql://localhost:3306/reserva_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true